<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    .rp-body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
    }

    .rp-form {
      background: #fff;
      padding: 30px;
      width: 350px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    .rp-title {
      margin-bottom: 20px;
      color: #333;
    }

    .rp-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .rp-input:focus {
      border-color: #667eea;
    }

    .rp-btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .rp-btn:hover {
      background: #5a67d8;
    }

    .rp-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .rp-gap {
      margin-bottom: 15px;
    }
  </style>
</head>

<body class="rp-body">

  <form id="resetForm" class="rp-form">
    <h2 class="rp-title">Reset Your Password</h2>

    <input 
      type="password" 
      id="newPassword" 
      class="rp-input rp-gap"
      placeholder="Enter new password" 
      required 
    />

    <input 
      type="password" 
      id="confirmPassword" 
      class="rp-input rp-gap"
      placeholder="Confirm new password" 
      required 
    />

    <button type="submit" id="resetBtn" class="rp-btn">
      Reset Password
    </button>
  </form>

  <script>
    const form = document.getElementById("resetForm");
    const resetBtn = document.getElementById("resetBtn");

    const params = new URLSearchParams(window.location.search);
    const uuid = params.get("uuid");

    if (!uuid) {
      alert("Invalid or expired reset link");
      window.location = "login.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (newPassword.length < 6) {
        alert("Password must be at least 6 characters");
        return;
      }

      if (newPassword !== confirmPassword) {
        alert("Passwords do not match");
        return;
      }

      resetBtn.disabled = true;

      try {
        const res = await axios.post(
          `/password/resetpassword/${uuid}`,
          { newPassword }
        );

        alert(res.data.message || "Password reset successful");
        window.location = "login.html";

      } catch (err) {
        alert(err.response?.data?.message || "Reset link expired or invalid");
      } finally {
        resetBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
